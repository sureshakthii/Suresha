  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="planets-bg" aria-hidden="true">
    <div class="orb sun"></div>
    <div class="orb saturn"><span class="ring"></span></div>
    <div class="orb moon"></div>
    <div class="orb jupiter"></div>
    <div class="orb mars"></div>
  </div>

  <!-- Splash -->
  <section id="splash" class="splash">
    <div class="splash-wheel">
      <svg viewBox="0 0 200 200" class="zodiac-spin" aria-hidden="true">
        <defs>
          <radialGradient id="sg" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffe7a3" /><stop offset="60%" stop-color="#f5b83d" /><stop offset="100%" stop-color="#b8620f" />
          </radialGradient>
        </defs>
        <circle cx="100" cy="100" r="96" fill="none" stroke="rgba(245,194,107,.55)" stroke-width="1.2" />
        <circle cx="100" cy="100" r="74" fill="none" stroke="rgba(245,194,107,.35)" stroke-width="1" />
        <g id="splash-signs"></g>
        <circle cx="100" cy="100" r="26" fill="url(#sg)" />
      </svg>
      <div class="orbit o1"><span class="p p1"></span></div>
      <div class="orbit o2"><span class="p p2"></span></div>
      <div class="orbit o3"><span class="p p3"></span></div>
      <img src="logo.svg" alt="" class="splash-logo" width="150" height="150" />
    </div>
    <h1 class="brand-ta">கைப்பேசி ஜோதிடர்</h1>
    <h2 class="brand-en">Kaippesi Jothidar</h2>
    <p class="tagline">ஜாதகம் · நட்சத்திரம் · ராசி மண்டலம் · ஓரை · பரிகாரம்</p>
    <p class="copy splash-copy">© 2026 கைப்பேசி ஜோதிடர்</p>
  </section>

  <main id="app" class="app" hidden>
    <header class="topbar">
      <button class="brand-mini" data-go="home" aria-label="Home">
        <img src="logo.svg" alt="" width="34" height="34" />
        <div>
          <div class="bm-ta">கைப்பேசி ஜோதிடர்</div>
          <div class="bm-en">Kaippesi Jothidar</div>
        </div>
      </button>
      <div class="top-actions"><button id="themeBtn" class="chip-btn icon-only" aria-label="Day / night"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></button>
      <button id="langBtn" class="chip-btn" aria-label="Change language">தமிழ் / EN</button></div>
    </header>

    <div id="views"></div>

    <nav class="tabbar" aria-label="Main">
      <button data-tab="home"><span class="ti"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><span data-i18n-en="Today" data-i18n-ta="இன்று">இன்று</span></button>

      <button data-tab="more"><span class="ti"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg></span><span data-i18n-en="More" data-i18n-ta="மேலும்">மேலும்</span></button>
