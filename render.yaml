# Render Blueprint — https://render.com/docs/blueprint-spec
# Render dashboard → New → Blueprint → pick this repository. Values marked `sync: false`
# are asked for when the Blueprint is created (and can be changed later under Environment).
# A persistent disk needs a paid instance type (Starter or above).
services:
  - type: web
    name: kaippesi-jothidar
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    autoDeploy: true
    healthCheckPath: /api/health
    disk:
      name: kaippesi-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: TRUST_PROXY
        value: "1"
      - key: PORT
        value: "3000"
      - key: DB_PATH
        value: "/data/kaippesi.db"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Optional tuning (uncomment to set):
      # - key: AI_REQUIRE_LOGIN
      #   value: "1"
      # - key: AI_RATE_LIMIT
      #   value: "40"
      # - key: BILLING_ENFORCE
      #   value: "1"
