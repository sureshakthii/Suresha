# Builds the Android and iOS apps.
#
# Two modes (chosen automatically by mobile/prepare.mjs):
#   • KJ_APP_URL NOT set  → STANDALONE offline app: the whole app is bundled inside the APK / iOS app,
#     all astrology runs on the phone; login, payments and bookings are disabled ("needs server" card).
#   • KJ_APP_URL set      → server-backed app that opens the deployed website (login, payments, bookings).
#     Set it under Settings → Secrets and variables → Actions → Variables, e.g. https://thunai.example
#
# Quick phone test (Android, no signing needed): Actions → "Mobile apps" → Run workflow → download the
# artifact `thunai-android-debug-apk` → unzip → copy app-debug.apk to the phone → install.
# Huawei: the same APK installs on Huawei phones; AppGallery accepts the signed APK or AAB.
# iPhone: see the notes on the ios job below and docs/INSTALL-TA.md.
name: Mobile apps

on:
  workflow_dispatch:
    inputs:
      review_hours:
        description: 'Review APK: hours it works after first launch on a phone'
        default: '24'
      review_days:
        description: 'Review APK: hard stop, days after this build (reinstalling cannot extend it)'
        default: '3'
  push:
    tags: ['v*']

env:
  KJ_APP_URL: ${{ vars.KJ_APP_URL }}

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish the test APK as a downloadable release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Capacitor 8 compiles with Java 21 (sourceCompatibility VERSION_21); Java 17 is not enough.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Prepare web bundle (standalone when KJ_APP_URL is unset)
        run: |
          if [ -z "$KJ_APP_URL" ]; then
            echo "::notice title=Standalone build::KJ_APP_URL is not set — building the offline standalone app. Set the repository variable KJ_APP_URL for the server-backed app."
          fi
          npm run mobile:android

      - name: Decode signing key (only when the secrets are set)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release builds will be signed."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — the release APK/AAB will be UNSIGNED (cannot be uploaded to Play / AppGallery)."
          fi

      - name: Build APK + AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease

      # Debug APK: installable on any Android / Huawei phone without a signing key
      # (enable "Install unknown apps"). For your own testing and for relatives' trials.
      - uses: actions/upload-artifact@v4
        with:
          name: thunai-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Phone-friendly download: a direct .apk link (no ZIP, no sign-in needed on a public repo):
      #   https://github.com/<owner>/<repo>/releases/download/test-latest/Thunai.apk
      # Kaippesi-Jothidar.apk (the old name) is still attached, so links already shared keep working.
      - name: Publish test APK as the "test-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Thunai.apk
          # Same APK under a build-numbered name: a fresh file name, so phones never re-use an old cached download.
          cp Thunai.apk Thunai-build-${{ github.run_number }}.apk
          cp Thunai.apk Kaippesi-Jothidar.apk   # legacy link only
          gh release delete test-latest --yes --cleanup-tag || true
          gh release create test-latest Thunai.apk Thunai-build-${{ github.run_number }}.apk Kaippesi-Jothidar.apk \
            --title "துணை · Thunai — test build ${{ github.run_number }}" \
            --notes "Test APK for Android / Samsung / Huawei. Tap Thunai.apk below to download and install. Build ${{ github.run_number }} from ${GITHUB_SHA::7}." \
            --prerelease --target "$GITHUB_SHA"
          echo "### 📲 Download on the phone: https://github.com/${{ github.repository }}/releases/download/test-latest/Thunai.apk" >> "$GITHUB_STEP_SUMMARY"
      # Time-limited review APK for outside testers: works for review_hours after its first launch on each phone
      # and never after review_days from this build; then it shows "contact the administrator".
      - name: Build and publish the time-limited review APK
        env:
          GH_TOKEN: ${{ github.token }}
          KJ_REVIEW_HOURS: ${{ inputs.review_hours || '24' }}
          KJ_REVIEW_DAYS: ${{ inputs.review_days || '3' }}
        run: |
          npm run mobile:android
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">துணை Review</string>#; s#<string name="title_activity_main">[^<]*</string>#<string name="title_activity_main">துணை Review</string>#' android/app/src/main/res/values/strings.xml
          (cd android && ./gradlew --no-daemon assembleDebug -PreviewBuild=true)
          cp android/app/build/outputs/apk/debug/app-debug.apk Thunai-Review-${KJ_REVIEW_HOURS}h.apk
          cp Thunai-Review-${KJ_REVIEW_HOURS}h.apk Thunai-Review-build-${{ github.run_number }}.apk
          gh release upload test-latest Thunai-Review-${KJ_REVIEW_HOURS}h.apk Thunai-Review-build-${{ github.run_number }}.apk --clobber
          git checkout -- android/app/src/main/res/values/strings.xml
          echo "### 🔒 Review APK (${KJ_REVIEW_HOURS} h, hard stop in ${KJ_REVIEW_DAYS} days): https://github.com/${{ github.repository }}/releases/download/test-latest/Thunai-Review-${KJ_REVIEW_HOURS}h.apk" >> "$GITHUB_STEP_SUMMARY"
      # Release APK (signed only when the ANDROID_* secrets are set) — for Huawei AppGallery / sideloading.
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  # iOS: this job only proves the project compiles (simulator build + UNSIGNED archive).
  # An unsigned archive cannot be installed on a real iPhone. To install on an iPhone you need a Mac with
  # Xcode and either
  #   • a free Apple ID ("Personal Team" in Xcode → Signing): runs on your own iPhone, expires after 7 days, or
  #   • the Apple Developer Program (US$99/year): TestFlight for up to 10,000 testers + App Store.
  # Steps: npm ci → npm run mobile:ios → npx cap open ios → App target → Signing & Capabilities → Team → ▶ Run.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - run: npm run mobile:ios   # standalone when KJ_APP_URL is unset

      # Compile check for the simulator (no signing needed).
      - name: Build for iOS Simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

      # Unsigned device archive. App Store upload needs Apple Developer signing — do that in Xcode on a Mac
      # (Product → Archive → Distribute App), see docs/MOBILE.md.
      - name: Archive (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive
          cd "$RUNNER_TEMP" && zip -qry App-unsigned.xcarchive.zip App.xcarchive

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-xcarchive
          path: ${{ runner.temp }}/App-unsigned.xcarchive.zip
          if-no-files-found: error
