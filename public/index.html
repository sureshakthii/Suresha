<!doctype html>
<html lang="ta">
<head>

  <link rel="manifest" href="/manifest.webmanifest" />

<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="planets-bg" aria-hidden="true">
    <div class="orb sun"></div>
    <div class="orb saturn"><span class="ring"></span></div>
    <div class="orb moon"></div>
    <div class="orb jupiter"></div>
    <div class="orb mars"></div>
  </div>

  <!-- Splash -->
  <section id="splash" class="splash">
    <div class="splash-wheel">
      <svg viewBox="0 0 200 200" class="zodiac-spin" aria-hidden="true">
        <defs>
          <radialGradient id="sg" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffe7a3" /><stop offset="60%" stop-color="#f5b83d" /><stop offset="100%" stop-color="#b8620f" />
          </radialGradient>
        </defs>
        <circle cx="100" cy="100" r="96" fill="none" stroke="rgba(245,194,107,.55)" stroke-width="1.2" />
        <circle cx="100" cy="100" r="74" fill="none" stroke="rgba(245,194,107,.35)" stroke-width="1" />
        <g id="splash-signs"></g>
        <circle cx="100" cy="100" r="26" fill="url(#sg)" />
      </svg>
      <div class="orbit o1"><span class="p p1"></span></div>
      <div class="orbit o2"><span class="p p2"></span></div>
      <div class="orbit o3"><span class="p p3"></span></div>
      <img src="logo.svg" alt="" class="splash-logo" width="150" height="150" />
    </div>
    <h1 class="brand-ta" data-brand="ta">துணை</h1>
    <h2 class="brand-en" data-brand="upper">THUNAI</h2>
    <p class="slogan" data-brand="tagline">உங்கள் வாழ்வின் வழித்துணை.</p>
    <p class="tagline" data-brand="descriptor">Personal Astrology &amp; Spiritual Guidance</p>
  </section>

  <main id="app" class="app" hidden>
    <header class="topbar">
      <button class="brand-mini" data-go="home" aria-label="Home">
        <img src="logo.svg" alt="" width="36" height="36" />
        <div>
          <div class="bm-ta"><span data-brand="ta">துணை</span><span class="bm-latin" data-brand="upper">THUNAI</span></div>
          <div class="bm-tag" data-brand="tagline-auto">உங்கள் வாழ்வின் வழித்துணை.</div>
        </div>
      </button>
      <div class="top-actions">
        <button id="langBtn" class="chip-btn" aria-label="Change language / மொழி மாற்று">EN</button>

        <button class="chip-btn icon-only" data-go="more" aria-label="Settings and account"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </header>

    <div id="views"></div>

      <button data-tab="familyhub"><span class="ti"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><span data-i18n-en="Family" data-i18n-ta="குடும்பம்">குடும்பம்</span></button>
